ription":"Introduces a set of modeling techniques that have become a mainstay of modern artificial intelligence and machine learning research. These techniques combine graphical models, Bayesian analysis, and multivariate statistics for probabilistic and causal inference and for interpreting the statistical structure of large data sets. Applications include healthcare, economics, marketing, social sciences, and more.","catalog_title":"Probabilistic and Causal Modeling in Computer Science","catalog_notes":"Requisites: Restricted to graduate students only. Recommended: Prerequisite undergraduate course in probability and statistics. Additional Information: Departmental Category: Artificial Intelligence","description_source":"catalog.colorado.edu"},{"course_code":"CSCI 5832","course_title":"Natural Language Processing","credits":3,"department":"Computer Science","program_section":"Section 4 – Elective (On-Campus)","description":"Explores the field of natural language processing as it is concerned with the theoretical and practical issues that arise in getting computers to perform useful and interesting tasks with natural language. Covers the problems of understanding complex language phenomena and building practical programs.","prerequisites":null,"source_url":"https://www.colorado.edu/program/data-science/campus/curriculum/data-science-electives","catalog_description":"Explores the field of natural language processing as it is concerned with the theoretical and practical issues that arise in getting computers to perform useful and interesting tasks with natural language. Covers the problems of understanding complex language phenomena and building practical programs.","catalog_notes":"Equivalent - Duplicate Degree Credit Not Granted: LING 5832 Requisites: Restricted to graduate students only. Additional Information: Departmental Category: Artificial Intelligence","description_source":"catalog.colorado.edu"},{"course_code":"CSCI 5880","course_title":"Interactive Machine Learning for Customizable and Expressive Interfaces","credits":null,"department":"Computer Science","program_section":"Section 4 – Elective (On-Campus)","description":"Teaches machine learning application for human-computer interfaces, processing video and accelerometer streams for interactive systems.","prerequisites":"Statistics course AND programming course (minimum C-)","notes":"Cross-listed: CSCI 4889, ATLS 4889, ATLS 5880. Restriction: ATLAS graduate students only.","source_url":"https://www.colorado.edu/program/data-science/campus/curriculum/data-science-electives","description_source":"colorado.edu/program/data-science"},{"course_code":"CSCI 6502","course_title":"Big Data Analytics: Systems, Algorithms, and Applications","credits":3,"department":"Computer Science","program_section":"Section 4 – Elective (On-Campus)","description":"This course studies state-of-the-art practice and research on efficient and effective systems and algorithms design for managing and exploring massive amounts of digital data in various application domains. The course takes an integrated approach that studies all three aspects of big data analytics: systems, algorithms, and applications. Specifically, this course covers big data systems for MapReduce, NoSQL, stream processing, deep learning, mobile/wearable/IoT sensing, as well as practical use of indexing, sketching, recommendation, graph, and deep learning algorithms. Domain-specific data management and analysis, such as those in online social networks, scientific discovery, business intelligence, health informatics, urban computing, are also covered.","prerequisites":null,"source_url":"https://www.colorado.edu/program/data-science/campus/curriculum/data-science-electives","catalog_description":"This course studies state-of-the-art practice and research on efficient and effective systems and algorithms design for managing and exploring massive amounts of digital data in various application domains. The course takes an integrated approach that studies all three aspects of big data analytics: systems, algorithms, and applications. Specifically, this course covers big data systems for MapReduce, NoSQL, stream processing, deep learning, mobile/wearable/IoT sensing, as well as practical use of indexing, sketching, recommendation, graph, and deep learning algorithms. Domain-specific data management and analysis, such as those in online social networks, scientific discovery, business intelligence, health informatics, urban computing, are also covered.","catalog_title":"Big Data Analytics: Systems, Algorithms, and Applications","catalog_notes":"Requisites: Restricted to graduate students only.","description_source":"catalog.colorado.edu"},{"course_code":"CSCI 7000","course_title":"Current Topics in Computer Science","credits":null,"department":"Computer Science","program_section":"Section 4 – Elective (On-Campus)","description":"Covers research topics of current interest in computer science that do not fall into a standard subarea.","prerequisites":"Graduate students only","notes":"Repeatable up to 8 credit hours","source_url":"https://www.colorado.edu/program/data-science/campus/curriculum/data-science-electives","description_source":"colorado.edu/program/data-science"},{"course_code":"DTSC 5810","course_title":"Capstone/Practicum","credits":null,"department":"Data Science","program_section":"Section 4 – Elective (On-Campus)","description":"Students conduct approved research, critical review, or project work, presenting to a capstone committee for evaluation.","prerequisites":null,"source_url":"https://www.colorado.edu/program/data-science/campus/curriculum/data-science-electives","description_source":"colorado.edu/program/data-science"},{"course_code":"DTSC 5840","course_title":"Independent Study","credits":null,"department":"Data Science","program_section":"Section 4 – Elective (On-Campus)","description":"Subjects arranged individually through graduate advisor and faculty approval.","prerequisites":null,"notes":"Repeatable up to 6 total credits","source_url":"https://www.colorado.edu/program/data-science/campus/curriculum/data-science-electives","description_source":"colorado.edu/program/data-science"},{"course_code":"DTSC 5900","course_title":"Special Topics in Data Science","credits":null,"department":"Data Science","program_section":"Section 4 – Elective (On-Campus)","description":"Examines special topics in Data Science.","prerequisites":null,"notes":"Repeatable up to 9 total credits","source_url":"https://www.colorado.edu/program/data-science/campus/curriculum/data-science-electives","description_source":"colorado.edu/program/data-science"},{"course_code":"DTSC 5930","course_title":"Professional Internship","credits":null,"department":"Data Science","program_section":"Section 4 – Elective (On-Campus)","description":"Academic credit structure for internships with industry partners, including mid-term and final performance assessments.","prerequisites":null,"source_url":"https://www.colorado.edu/program/data-science/campus/curriculum/data-science-electives","description_source":"colorado.edu/program/data-science"},{"course_code":"GEOG 5103","course_title":"Geographic Information Science: Spatial Analytics","credits":4,"department":"Geography","program_section":"Section 4 – Elective (On-Campus)","description":"Explores advanced topics in geospatial databases, spatial analytics and geoprocessing in a Geographic Information System (GIS). Emphasizes how geographic concepts are linked to methodological frameworks for recording, transforming, storing/retrieving, analyzing, and processing geographic data as well as various forms of uncertainty. Exercises demonstrate the application of GIS-based methods to real world scenarios in interdisciplinary settings.","prerequisites":"Graduate students only","notes":"Cross-listed: GEOG 4103","source_url":"https://www.colorado.edu/program/data-science/campus/curriculum/data-science-electives","catalog_description":"Explores advanced topics in geospatial databases, spatial analytics and geoprocessing in a Geographic Information System (GIS). Emphasizes how geographic concepts are linked to methodological frameworks for recording, transforming, storing/retrieving, analyzing, and processing geographic data as well as various forms of uncertainty. Exercises demonstrate the application of GIS-based methods to real world scenarios in interdisciplinary settings.","catalog_title":"Geographic Information Science: Spatial Analytics","catalog_notes":"Equivalent - Duplicate Degree Credit Not Granted: GEOG 4103 Requisites: Restricted to graduate students only. Additional Information: Departmental Category: GIScience","description_source":"catalog.colorado.edu"},{"course_code":"GEOG 5203","course_title":"Geographic Information Science: Spatial Modeling","credits":4,"department":"Geography","program_section":"Section 4 – Elective (On-Campus)","description":"Focuses on the use and development of advanced models for human and environmental applications in a geospatial environment integrating raster and vector data models. Covers terrain and hydrologic modeling, geostatistical modeling, dasymetric modeling, as well as multi-criteria modeling. Group projects critically design, implement and test spatial models to develop independent skillsets in a chosen problem setting.","prerequisites":"Graduate students; Recommended: GEOG 4103/5103 or GIS experience","notes":"Cross-listed: GEOG 4203","source_url":"https://www.colorado.edu/program/data-science/campus/curriculum/data-science-electives","catalog_description":"Focuses on the use and development of advanced models for human and environmental applications in a geospatial environment integrating raster and vector data models. Covers terrain and hydrologic modeling, geostatistical modeling, dasymetric modeling, as well as multi-criteria modeling. Group projects critically design, implement and test spatial models to develop independent skillsets in a chosen problem setting.","catalog_title":"Geographic Information Science: Spatial Modeling","catalog_notes":"Equivalent - Duplicate Degree Credit Not Granted: GEOG 4203 Requisites: Restricted to graduate students only. Recommended: Prerequisite GEOG 4103 or GEOG 5103 or working knowledge of GIS software or instructor consent required. Additional Information: Departmental Category: Methods","description_source":"catalog.colorado.edu"},{"course_code":"GEOG 5303","course_title":"Geographic Information Science: Spatial Programming","credits":4,"department":"Geography","program_section":"Section 4 – Elective (On-Campus)","description":"Focuses on the extension of geographic information systems (GIS) through programming as well as on the development of algorithms for spatial analysis and information extraction in vector and raster data using open source tools. Covers concepts, principles and techniques of programming and solving spatial problems in natural and social science settings. Group projects will foster skillsets in implementing solutions to complex spatial problems.","prerequisites":"Recommended: GEOG 4203/5203","notes":"Cross-listed: GEOG 4303","source_url":"https://www.colorado.edu/program/data-science/campus/curriculum/data-science-electives","catalog_description":"Focuses on the extension of geographic information systems (GIS) through programming as well as on the development of algorithms for spatial analysis and information extraction in vector and raster data using open source tools. Covers concepts, principles and techniques of programming and solving spatial problems in natural and social science settings. Group projects will foster skillsets in implementing solutions to complex spatial problems.","catalog_title":"Geographic Information Science: Spatial Programming","catalog_notes":"Equivalent - Duplicate Degree Credit Not Granted: GEOG 4303 Requisites: Restricted to graduate students only. Recommended: Prerequisite GEOG 4203 /5203. Additional Information: Departmental Category: GIScience","description_source":"catalog.colorado.edu"},{"course_code":"GEOG 5563","course_title":"Earth Analytics","credits":3,"department":"Geography","program_section":"Section 4 – Elective (On-Campus)","description":"Introduce students to major unanswered questions in Earth science and to the analytical tools, including data management, analysis and visualization, necessary to explore 'big data' from a suite of sensors. Aligns with Earth Lab, a new initiative of the University's Grand Challenge (http://www.colorado.edu/grandchallenges/) to use our expertise in space-based observation to address our world's most pressing problem. Comparable programming course work may be substituted for GEOG 5463 with instructor approval.","prerequisites":null,"source_url":"https://www.colorado.edu/program/data-science/campus/curriculum/data-science-electives","catalog_description":"Introduce students to major unanswered questions in Earth science and to the analytical tools, including data management, analysis and visualization, necessary to explore 'big data' from a suite of sensors. Aligns with Earth Lab, a new initiative of the University's Grand Challenge (http://www.colorado.edu/grandchallenges/) to use our expertise in space-based observation to address our world's most pressing problem. Comparable programming course work may be substituted for GEOG 5463 with instructor approval.","catalog_title":"Earth Analytics","catalog_notes":"Equivalent - Duplicate Degree Credit Not Granted: GEOG 4563 Requisites: Requires prerequisite course of GEOG 5463 (min grade B-) Restricted to graduate students only. Grading Basis: Letter Grade","description_source":"catalog.colorado.edu"},{"course_code":"INFO 5507","course_title":"Data and the Humanities","credits":3,"department":"Information Science","program_section":"Section 4 – Elective (On-Campus)","description":"Introduces students to foundational computing and statistical concepts for analyzing humanities data. This course discusses the influence of digitization and data on humanist inquiry and exposes students to techniques for working with data in different areas of the humanities, including literature, history, and art. The course emphasizes technical practices involved in humanist data analysis. Comfort with programming is strongly encouraged.","prerequisites":"Recommended: Programming comfort","source_url":"https://www.colorado.edu/program/data-science/campus/curriculum/data-science-electives","catalog_description":"Introduces students to foundational computing and statistical concepts for analyzing humanities data. This course discusses the influence of digitization and data on humanist inquiry and exposes students to techniques for working with data in different areas of the humanities, including literature, history, and art. The course emphasizes technical practices involved in humanist data analysis. Comfort with programming is strongly encouraged.","catalog_title":"Data and the Humanities","catalog_notes":"Equivalent - Duplicate Degree Credit Not Granted: INFO 3507 Requisites: Restricted to graduate students only. Grading Basis: Letter Grade","description_source":"catalog.colorado.edu"},{"course_code":"INFO 5601","course_title":"Information Ethics and Policy","credits":3,"department":"Information Science","program_section":"Section 4 – Elective (On-Campus)","description":"Explores ethical and legal complexities of information and communication technology. By combining real-world inquiry with creative speculation, students will probe everyday ethical dilemmas they face as digital consumers, creators and coders, as well as relevant policy. Explores themes such as privacy, intellectual property, social justice, free speech, artificial intelligence, social media and ethical lessons from science fiction.","prerequisites":null,"source_url":"https://www.colorado.edu/program/data-science/campus/curriculum/data-science-electives","catalog_description":"Explores ethical and legal complexities of information and communication technology. By combining real-world inquiry with creative speculation, students will probe everyday ethical dilemmas they face as digital consumers, creators and coders, as well as relevant policy. Explores themes such as privacy, intellectual property, social justice, free speech, artificial intelligence, social media and ethical lessons from science fiction.","catalog_title":"Information Ethics and Policy","catalog_notes":"Equivalent - Duplicate Degree Credit Not Granted: INFO 4601 Requisites: Restricted to graduate students only. Grading Basis: Letter Grade","description_source":"catalog.colorado.edu"},{"course_code":"INFO 5612","course_title":"Recommender Systems","credits":3,"department":"Information Science","program_section":"Section 4 – Elective (On-Campus)","description":"Explores the space of personalized information access applications known as recommender systems. This class will introduce students to a range of approaches for building recommender systems including collaborative, content-based, knowledge-based, and hybrid methods. Students will also explore a variety of applications for recommendation including consumer products, music, social media, and online advertising. The course will also examine controversies surrounding recommendation, including Pariser's \"filter bubble\", and questions of algorithmic bias. Proficiency in Python programming required.","prerequisites":"Python proficiency required","source_url":"https://www.colorado.edu/program/data-science/campus/curriculum/data-science-electives","catalog_description":"Explores the space of personalized information access applications known as recommender systems. This class will introduce students to a range of approaches for building recommender systems including collaborative, content-based, knowledge-based, and hybrid methods. Students will also explore a variety of applications for recommendation including consumer products, music, social media, and online advertising. The course will also examine controversies surrounding recommendation, including Pariser's \"filter bubble\", and questions of algorithmic bias. Proficiency in Python programming required.","catalog_notes":"Requisites: Restricted to graduate students only. Grading Basis: Letter Grade","description_source":"catalog.colorado.edu"},{"course_code":"INFO 5613","course_title":"Network Science","credits":3,"department":"Information Science","program_section":"Section 4 – Elective (On-Campus)","description":"Introduces theories and methods for analyzing relational data in social, information, and other complex networks. Students will understand the processes and theories explaining network structure and dynamics as well as develop skills analyzing and visualizing real-world network data. No math or statistics training required, but course will assume familiarity with Python.","prerequisites":"Python familiarity","source_url":"https://www.colorado.edu/program/data-science/campus/curriculum/data-science-electives","catalog_description":"Introduces theories and methods for analyzing relational data in social, information, and other complex networks. Students will understand the processes and theories explaining network structure and dynamics as well as develop skills analyzing and visualizing real-world network data. No math or statistics training required, but course will assume familiarity with Python.","catalog_notes":"Equivalent - Duplicate Degree Credit Not Granted: INFO 4613 Requisites: Restricted to graduate students only. Grading Basis: Letter Grade","description_source":"catalog.colorado.edu"},{"course_code":"INFO 5653","course_title":"Text Mining","credits":3,"department":"Information Science","program_section":"Section 4 – Elective (On-Campus)","description":"Introduces students to techniques for extracting information from text data, including text gathering and cleaning, and text processing methods, such as dimensionality reduction, normalization, and text visualization. It will introduce applications and methodologies of machine learning for text, such as sentiment analysis, association rule mining, and topic modeling.","prerequisites":null,"source_url":"https://www.colorado.edu/program/data-science/campus/curriculum/data-science-electives","catalog_description":"Introduces students to techniques for extracting information from text data, including text gathering and cleaning, and text processing methods, such as dimensionality reduction, normalization, and text visualization. It will introduce applications and methodologies of machine learning for text, such as sentiment analysis, association rule mining, and topic modeling.","description_source":"catalog.colorado.edu"},{"course_code":"IPHY 5800","course_title":"Advanced Statistics and Research Methods in Integrative Physiology","credits":4,"department":"Integrative Physiology","program_section":"Section 4 – Elective (On-Campus)","description":"Introduces advanced statistical techniques important for analyzing data rising in biomedical research, including physiology. StatistIcal reasoning will be emphasized through problem solving and applications using statistical software packages.","prerequisites":"IPHY or C-IPHY graduate students only; Recommended: IPHY 2800","source_url":"https://www.colorado.edu/program/data-science/campus/curriculum/data-science-electives","catalog_description":"Introduces advanced statistical techniques important for analyzing data rising in biomedical research, including physiology. StatistIcal reasoning will be emphasized through problem solving and applications using statistical software packages.","catalog_notes":"Requisites: Restricted to Integrative Physiology (IPHY) or Integrative Physiology Concurrent Degree (C-IPHY) graduate students only. Recommended: Prerequisite IPHY 2800.","description_source":"catalog.colorado.edu"},{"course_code":"MATH 5440","course_title":"Mathematics of Coding and Cryptography","credit , and manufacturing.\nNobleAI turns sparse, multi-source industrial data into predictive models and decision-grade insights. By combining physics and chemistry expertise with advanced machine learning, our platform improves resource recovery, asset performance, and product quality. We serve companies that rely on precise formulations and material composition to determine product performance, safety, and regulatory compliance for their chemical products. For those producing physical products at scale, we help ensure that ingredients, materials, and formulations drive quality, consistency, speed-to-market, and margin. Our solutions are also vital for companies developing energy products or managing energy assets, where throughput, recovery, and operational reliability directly impact revenue and asset economics.\nAs we continue to grow our team, we pay careful attention to finding the best fit for the role and the team. Teamwork, trust and transparency motivate us to innovate and act with speed, which allows us to deliver value to our customers. We are committed to acting with integrity in every interaction with our fellow team members. For our customers, we will deliver r","description_word_count":694,"seniority_level":"Mid-Senior level","employment_type":"Full-time","job_function":"Other","industries":"IT Services and IT Consulting","work_arrangement":"","applicants":"Be among the first 25 applicants","search_keyword":"Applied Scientist"}]
</script>
<script>

const CDATA = JSON.parse(document.getElementById('d-courses').textContent);
const JDATA = JSON.parse(document.getElementById('d-jobs').textContent);

const allCourses = [
  ...CDATA.courses.online_dtsa.map(c => ({...c, format: 'online'})),
  ...CDATA.courses.on_campus_electives.map(c => ({...c, format: 'campus'}))
];

const SECTION_RAIL = {
  pathway: '#4B8BCA', vital: '#2E9E6F',
  core: '#7B5EA7', elective: '#C4622D', campus: '#6B7A99'
};

const ROLE_RAIL = {
  'Data Scientist': '#2D7AC4', 'AI Engineer': '#6B4EC4',
  'ML Engineer': '#1F9E7C', 'MLOps Engineer': '#C46B2D',
  'Machine Learning Engineer': '#1F9E7C', 'Applied Scientist': '#C42D5A',
  'Data Science': '#2D7AC4'
};

function sectionType(c) {
  const s = c.program_section || '';
  if (s.includes('Pathway')) return 'pathway';
  if (s.includes('Vital')) return 'vital';
  if (s.includes('Section 3') || (s.includes('Core') && !s.includes('Elective'))) return 'core';
  if (c.format === 'campus') return 'campus';
  return 'elective';
}

function sectionLabel(c) {
  const s = c.program_section || '';
  if (s.includes('Pathway')) return 'Pathway';
  if (s.includes('Vital')) return 'Vital Skills';
  if (s.includes('Section 3') || (s.includes('Core') && !s.includes('Elective'))) return 'Core';
  return 'Elective';
}

const state = {
  tab: 'courses',
  cSearch: '', cFormat: 'all', cSection: 'all', cSpec: 'all', cDept: 'all',
  jSearch: '', jRole: 'all', jSeniority: 'all', jWork: 'all',
  sSearch: '', sRole: 'all', sCat: 'all', sMinDelta: 0,
  pRole: null, pCompleted: new Set(), pFormat: 'all', pCat: 'all',
  selected: null
};

function filteredCourses() {
  let list = allCourses;
  if (state.cFormat !== 'all') list = list.filter(c => c.format === state.cFormat);
  if (state.cSection !== 'all') list = list.filter(c => sectionType(c) === state.cSection);
  if (state.cSpec !== 'all') list = list.filter(c => (c.specialization||'') === state.cSpec);
  if (state.cDept !== 'all') list = list.filter(c => (c.department||'') === state.cDept);
  if (state.cSearch) {
    const q = state.cSearch.toLowerCase();
    list = list.filter(c =>
      (c.course_title||'').toLowerCase().includes(q) ||
      (c.course_code||'').toLowerCase().includes(q) ||
      (c.description||'').toLowerCase().includes(q) ||
      (c.topics||[]).some(t => t.toLowerCase().includes(q))
    );
  }
  return list;
}

function filteredJobs() {
  let list = JDATA;
  if (state.jRole !== 'all') list = list.filter(j => j.search_keyword === state.jRole);
  if (state.jSeniority !== 'all') {
    const s = state.jSeniority;
    list = list.filter(j => {
      const sl = (j.seniority_level||'').toLowerCase();
      if (s === 'entry') return sl.includes('entry') || sl.includes('associate') || sl.includes('internship');
      if (s === 'mid') return sl.includes('mid') || sl.includes('not applicable');
      if (s === 'senior') return sl.includes('senior') || sl.includes('director') || sl.includes('executive') || sl.includes('manager');
      return true;
    });
  }
  if (state.jWork !== 'all') {
    list = list.filter(j => (j.work_arrangement||'').toLowerCase().includes(state.jWork));
  }
  if (state.jSearch) {
    const q = state.jSearch.toLowerCase();
    list = list.filter(j =>
      (j.title||'').toLowerCase().includes(q) ||
      (j.company||'').toLowerCase().includes(q) ||
      (j.description||'').toLowerCase().includes(q) ||
      (j.industries||'').toLowerCase().includes(q)
    );
  }
  return list;
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderCourseCard(c) {
  const st = sectionType(c);
  const rail = SECTION_RAIL[st] || '#999';
  const sl = sectionLabel(c);
  const topics = c.topics || [];
  const showTopics = topics.slice(0, 4);
  const extra = topics.length - showTopics.length;
  const isOnline = c.format === 'online';
  const specShort = (c.specialization||'').replace('Data Science Foundations: ','').replace(' Pathway','');
  const deptOrSpec = isOnline ? (specShort ? `<span class="card__badge">${esc(specShort)}</span>` : '') : (c.department ? `<span class="card__badge">${esc(c.department)}</span>` : '');
  const formatBadge = isOnline ? `<span class="card__badge">Online</span>` : `<span class="card__badge">On-Campus</span>`;
  const secBadge = `<span class="card__badge" style="color:${rail};border-color:${rail}40;background:${rail}12">${sl}</span>`;
  const creditBadge = c.credits ? `<span class="card__badge">${c.credits} cr</span>` : '';

  return `
<article class="card" tabindex="0" data-id="${esc(c.course_code)}" data-type="course"
  onclick="openDrawer('course','${esc(c.course_code)}')"
  onkeydown="if(event.key==='Enter')openDrawer('course','${esc(c.course_code)}')">
  <div class="card__rail" style="background:${rail}"></div>
  <div class="card__body">
    <div class="card__header">
      <span class="card__code">${esc(c.course_code)}</span>
      <span class="card__title">${esc(c.course_title)}</span>
    </div>
    <div class="card__meta">
      ${secBadge}${formatBadge}${creditBadge}${deptOrSpec}
    </div>
    <p class="card__desc">${esc(c.description||'')}</p>
    ${showTopics.length ? `<div class="card__topics">
      ${showTopics.map(t=>`<span class="card__topic">${esc(t)}</span>`).join('')}
      ${extra > 0 ? `<span class="card__more-topics">+${extra} more</span>` : ''}
    </div>` : ''}
  </div>
</article>`;
}

function renderJobCard(j) {
  const role = j.search_keyword || 'Data Science';
  const rail = ROLE_RAIL[role] || '#2D7AC4';
  const roleAbbr = {
    'Data Scientist':'DS','AI Engineer':'AI','ML Engineer':'ML',
    'MLOps Engineer':'MLOps','Machine Learning Engineer':'MLE',
    'Applied Scientist':'AS','Data Science':'DS'
  }[role] || 'DS';
  const seniority = j.seniority_level && j.seniority_level !== 'Not Applicable' ? j.seniority_level : '';
  const desc = (j.description||'').replace(/\n+/g,' ').substring(0, 220);

  return `
<article class="card" tabindex="0" data-id="${esc(j.job_id)}" data-type="job"
  onclick="openDrawer('job','${esc(j.job_id)}')"
  onkeydown="if(event.key==='Enter')openDrawer('job','${esc(j.job_id)}')">
  <div class="card__rail" style="background:${rail}"></div>
  <div class="card__body">
    <div class="card__header">
      <span class="card__code" style="background:${rail}18;color:${rail}">${roleAbbr}</span>
      <span class="card__title">${esc(j.title)}</span>
    </div>
    <div class="card__meta">
      <span class="card__badge">${esc(j.company)}</span>
      <span class="card__badge">${esc(j.location)}</span>
      ${j.employment_type ? `<span class="card__badge">${esc(j.employment_type)}</span>` : ''}
      ${seniority ? `<span class="card__badge">${esc(seniority)}</span>` : ''}
      ${j.work_arrangement ? `<span class="card__badge">${esc(j.work_arrangement)}</span>` : ''}
    </div>
    <p class="card__desc">${esc(desc)}${desc.length >= 220 ? '…' : ''}</p>
    <div class="card__meta" style="margin:0">
      ${j.industries ? `<span class="card__badge" style="font-style:italic">${esc(j.industries.split(',')[0].trim())}</span>` : ''}
      ${j.applicants ? `<span class="card__badge">${esc(j.applicants)}</span>` : ''}
      ${j.posted_text ? `<span class="card__badge">${esc(j.posted_text)}</span>` : ''}
    </div>
  </div>
</article>`;
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('result-count');
  if (state.tab === 'courses') {
    const list = filteredCourses();
    countEl.innerHTML = `Showing <strong>${list.length}</strong> of ${allCourses.length} courses`;
    document.getElementById('sidebar-count').textContent = `${list.length} shown`;
    if (!list.length) {
      grid.innerHTML = `<div class="empty-state"><p>🔍</p><p>No courses match your filters.</p></div>`;
    } else {
      grid.innerHTML = list.map(renderCourseCard).join('');
    }
  } else if (state.tab === 'jobs') {
    const list = filteredJobs();
    countEl.innerHTML = `Showing <strong>${list.length}</strong> of ${JDATA.length} jobs`;
    document.getElementById('sidebar-count').textContent = `${list.length} shown`;
    if (!list.length) {
      grid.innerHTML = `<div class="empty-state"><p>🔍</p><p>No jobs match your filters.</p></div>`;
    } else {
      grid.innerHTML = list.map(renderJobCard).join('');
    }
  } else if (state.tab === 'suggestions') {
    const list = filteredSuggestions();
    const total = Object.keys(SDATA).length;
    countEl.innerHTML = `Showing <strong>${list.length}</strong> of ${total} courses`;
    document.getElementById('sidebar-count').textContent = `${list.length} shown`;
    if (!list.length) {
      grid.innerHTML = `<div class="empty-state"><p>🔍</p><p>No courses match your filters.</p></div>`;
    } else {
      grid.innerHTML = list.map(renderSuggestionCard).join('');
    }
  } else if (state.tab === 'planner') {
    const remaining = allCourses.filter(c => !state.pCompleted.has(c.course_code)).length;
    if (!state.pRole) {
      countEl.innerHTML = 'Choose a role to see personalized course recommendations';
      document.getElementById('sidebar-count').textContent = '--';
      grid.innerHTML = `<div class="plan-grid"><div class="plan-intro">
        <h3>Choose your target job role</h3>
        <p>Pick a role on the left, then mark courses you've already completed. We'll show you what to take next.</p>
      </div></div>`;
    } else {
      const list = filteredPlanner();
      countEl.innerHTML = `<strong>${list.length}</strong> courses recommended for <strong>${state.pRole}</strong>${state.pCompleted.size ? ` &bull; ${state.pCompleted.size} completed` : ''}`;
      document.getElementById('sidebar-count').textContent = `${list.length} shown`;
      if (!list.length) {
        grid.innerHTML = `<div class="plan-grid"><div class="plan-intro">
          <h3>All done here!</h3>
          <p>You've completed all courses that match this role and filter. Try clearing some filters.</p>
        </div></div>`;
      } else {
        grid.innerHTML = `<div class="plan-grid">${list.map((c,i) => renderPlanCard(c, i+1)).join('')}</div>`;
      }
    }
  }
}

function renderFilters() {
  const cFilters = document.getElementById('course-filters');
  const jFilters = document.getElementById('job-filters');
  const sFilters = document.getElementById('sugg-filters');
  cFilters.style.display = state.tab === 'courses' ? '' : 'none';
  jFilters.style.display = state.tab === 'jobs' ? '' : 'none';
  sFilters.style.display = state.tab === 'suggestions' ? '' : 'none';
  const pFilters = document.getElementById('planner-filters');
  if (pFilters) {
    pFilters.style.display = state.tab === 'planner' ? '' : 'none';
    if (state.tab === 'planner') renderPlannerSidebar();
  }
}

function openDrawer(type, id) {
  const drawer = document.getElementById('drawer');
  const overlay = document.getElementById('overlay');
  const header = document.getElementById('drawer-header');
  const body = document.getElementById('drawer-body');

  let codeHtml = '', titleHtml = '', metaHtml = '', contentHtml = '';

  if (type === 'course') {
    const c = allCourses.find(x => x.course_code === id);
    if (!c) return;
    const st = sectionType(c);
    const rail = SECTION_RAIL[st] || '#999';
    const topics = c.topics || [];
    const isOnline = c.format === 'online';

    codeHtml = `<span class="drawer__code">${esc(c.course_code)}</span>`;
    titleHtml = `<div class="drawer__title">${esc(c.course_title)}</div>`;
    metaHtml = `<div class="drawer__meta">
      <span class="card__badge" style="color:${rail};border-color:${rail}40;background:${rail}12">${sectionLabel(c)}</span>
      <span class="card__badge">${isOnline ? 'Online (Coursera)' : 'On-Campus'}</span>
      ${c.credits ? `<span class="card__badge">${c.credits} credit${c.credits>1?'s':''}</span>` : ''}
      ${c.department ? `<span class="card__badge">${esc(c.department)}</span>` : ''}
    </div>`;

    contentHtml = `
      ${c.specialization ? `<div>
        <div class="drawer__section-label">Specialization</div>
        <div style="font-size:13px;color:var(--ink2)">${esc(c.specialization)}</div>
      </div><hr class="drawer__divider">` : ''}
      <div>
        <div class="drawer__section-label">Description</div>
        <p class="drawer__desc">${esc(c.description||'')}</p>
      </div>
      ${topics.length ? `<div>
        <div class="drawer__section-label">Topics Covered</div>
        <div class="drawer__topics">${topics.map(t=>`<span class="drawer__topic">${esc(t)}</span>`).join('')}</div>
      </div>` : ''}
      ${c.prerequisites ? `<div>
        <div class="drawer__section-label">Prerequisites</div>
        <div style="font-size:13px;color:var(--ink2)">${esc(c.prerequisites)}</div>
      </div>` : ''}
      ${c.notes ? `<div>
        <div class="drawer__section-label">Notes</div>
        <div style="font-size:13px;color:var(--ink2)">${esc(c.notes)}</div>
      </div>` : ''}
      <div>
        <div class="drawer__section-label">Description Source</div>
        ${c.description_source === 'catalog.colorado.edu'
          ? '<span style="font-size:12px;color:var(--accent);font-weight:600">✓ Official CU Catalog</span>'
          : '<span style="font-size:12px;color:var(--muted)">Program website</span>'}
      </div>
      <div>
        <div class="drawer__section-label">Course Page</div>
        <a href="${esc(c.source_url)}" target="_blank" rel="noopener" class="drawer__link">
          ${esc(c.source_url)} ↗
        </a>
      </div>`;
  } else {
    const j = JDATA.find(x => x.job_id === id);
    if (!j) return;
    const role = j.search_keyword || 'Data Science';
    const rail = ROLE_RAIL[role] || '#2D7AC4';

    codeHtml = `<span class="drawer__code" style="background:${rail}18;color:${rail}">${esc(role)}</span>`;
    titleHtml = `<div class="drawer__title">${esc(j.title)}</div>`;
    metaHtml = `<div class="drawer__meta">
      <span class="card__badge" style="font-weight:600">${esc(j.company)}</span>
      <span class="card__badge">${esc(j.location)}</span>
      ${j.employment_type ? `<span class="card__badge">${esc(j.employment_type)}</span>` : ''}
      ${j.seniority_level ? `<span class="card__badge">${esc(j.seniority_level)}</span>` : ''}
      ${j.work_arrangement ? `<span class="card__badge" style="color:${rail};border-color:${rail}30">${esc(j.work_arrangement)}</span>` : ''}
    </div>`;

    contentHtml = `
      <div>
        <div class="drawer__section-label">Job Description</div>
        <p class="drawer__desc" style="font-size:13px">${esc(j.description||'').replace(/\n/g,'<br>')}</p>
        ${j.description_word_count > 0 ? `<p style="font-size:11px;color:var(--muted);margin-top:6px">${j.description_word_count} words total (showing first 1,400 chars)</p>` : ''}
      </div>
      ${(j.industries||j.job_function) ? `<div>
        <div class="drawer__section-label">Industry / Function</div>
        <div style="font-size:13px;color:var(--ink2)">${esc(j.industries||'')}${j.industries&&j.job_function?' · ':''}${esc(j.job_function||'')}</div>
      </div>` : ''}
      ${j.applicants ? `<div>
        <div class="drawer__section-label">Applicants</div>
        <div style="font-size:13px;color:var(--ink2)">${esc(j.applicants)}</div>
      </div>` : ''}
      ${j.posted_text ? `<div>
        <div class="drawer__section-label">Posted</div>
        <div style="font-size:13px;color:var(--ink2)">${esc(j.posted_text)}${j.posted_date ? ` (${esc(j.posted_date)})` : ''}</div>
      </div>` : ''}
      <div>
        <div class="drawer__section-label">LinkedIn Listing</div>
        <a href="${esc(j.url)}" target="_blank" rel="noopener" class="drawer__link">
          View on LinkedIn ↗
        </a>
      </div>`;
  }

  header.innerHTML = `
    <button class="drawer__close" onclick="closeDrawer()" aria-label="Close">×</button>
    ${codeHtml}${titleHtml}${metaHtml}`;
  body.innerHTML = contentHtml;

  drawer.classList.add('open');
  overlay.classList.add('visible');
  state.selected = id;

  // Mark selected card
  document.querySelectorAll('.card').forEach(el => el.classList.remove('selected'));
  const sel = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
  if (sel) sel.classList.add('selected');
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('visible');
  document.querySelectorAll('.card').forEach(el => el.classList.remove('selected'));
  state.selected = null;

// ── Suggestions tab ──────────────────────────────────────────────────────────
const SDATA = JSON.parse(document.getElementById('d-suggestions').textContent);
const SROLELABELS = ["AI Engineer", "Applied Scientist", "Data Scientist", "ML Engineer", "MLOps Engineer", "Machine Learning Engineer"];

// Course metadata lookup (from allCourses)
const courseMetaByCode = {};
allCourses.forEach(c => { courseMetaByCode[c.course_code] = c; });

function setSuggFilter(key, val, el) {
  if (key === 'role') state.sRole = val;
  if (key === 'cat')  state.sCat  = val;
  // Update chip active state within same group
  el.closest('.filter-chips').querySelectorAll('.chip')
    .forEach(b => b.classList.toggle('active', b === el));
  renderGrid();
}

function filteredSuggestions() {
  const q = (state.sSearch || '').toLowerCase();
  return Object.keys(SDATA).filter(code => {
    // text search
    if (q) {
      const meta = courseMetaByCode[code] || {};
      const hay  = (code + ' ' + (meta.course_title || '')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    // category filter
    if (state.sCat !== 'all') {
      const meta = courseMetaByCode[code] || {};
      const cat  = (meta.course_category || meta.program_section || '').toLowerCase();
      const isCore = !cat.includes('section 4') && !cat.includes('elective');
      if (state.sCat === 'core'     && !isCore) return false;
      if (state.sCat === 'elective' &&  isCore) return false;
    }
    // min delta filter
    if (state.sMinDelta > 0) {
      const roles  = SDATA[code];
      const selRole = state.sRole;
      const rolesToCheck = selRole === 'all' ? Object.values(roles) : [roles[selRole]].filter(Boolean);
      const maxDelta = Math.max(...rolesToCheck.map(r => r.d || 0), 0);
      if (maxDelta < state.sMinDelta) return false;
    }
    // role filter: keep course if it has any data for this role
    if (state.sRole !== 'all' && !SDATA[code][state.sRole]) return false;
    return true;
  }).sort((a, b) => {
    // sort by max delta across selected roles, descending
    const maxDelta = code => {
      const roles = SDATA[code];
      const vals  = state.sRole === 'all'
        ? Object.values(roles) : [roles[state.sRole]].filter(Boolean);
      return Math.max(...vals.map(r => r.d || 0), 0);
    };
    return maxDelta(b) - maxDelta(a);
  });
}

function renderSuggestionCard(code) {
  const cdata  = SDATA[code] || {};
  const meta   = courseMetaByCode[code] || {};
  const title  = meta.course_title || code;
  const secRaw = (meta.program_section || '').toLowerCase();
  const isCore = !secRaw.includes('section 4') && !secRaw.includes('elective');
  const catLabel  = isCore ? 'Core' : 'Elective';
  const catClass  = isCore ? 'core' : 'elective';
  const isOnline  = code.startsWith('DTSA');
  const typeLabel = isOnline ? 'Online' : 'On-Campus';

  const roles = state.sRole === 'all' ? SROLELABELS : [state.sRole];
  const rows  = roles.map(role => {
    const rd = cdata[role];
    if (!rd) return '';
    const before  = rd.b.toFixed(1);
    const after   = rd.a.toFixed(1);
    const delta   = rd.d;
    const dclass  = delta > 0 ? 'pos' : 'zero';
    const dsign   = delta > 0 ? '+' : '';
    const barPct  = Math.min(100, (delta / 60) * 100).toFixed(0);
    return `<div class="sugg-role-row">
      <span class="sugg-role-name">${esc(role)}</span>
      <span class="sugg-scores">
        <span class="sugg-score before">${before}</span>
        <span class="sugg-arrow">→</span>
        <span class="sugg-score after">${after}</span>
      </span>
      <span class="sugg-delta ${dclass}">${dsign}${delta.toFixed(1)}</span>
      <div class="sugg-bar-wrap">
        <div class="sugg-bar-fill" style="width:${barPct}%"></div>
      </div>
    </div>`;
  }).join('');

  return `<div class="sugg-card" onclick="openSuggestionDrawer('${esc(code)}')">
    <div class="sugg-card__head">
      <span class="sugg-card__code">${esc(code)}</span>
      <span class="sugg-card__title" title="${esc(title)}">${esc(title)}</span>
      <span class="sugg-badge ${catClass}">${catLabel}</span>
      <span class="sugg-badge online">${typeLabel}</span>
    </div>
    ${rows}
  </div>`;
}

function openSuggestionDrawer(code) {
  const cdata  = SDATA[code] || {};
  const meta   = courseMetaByCode[code] || {};
  const title  = meta.course_title || code;
  const secRaw = (meta.program_section || '').toLowerCase();
  const isCore = !secRaw.includes('section 4') && !secRaw.includes('elective');
  const catLabel = isCore ? 'Core' : 'Elective';

  const drawer  = document.getElementById('drawer');
  const overlay = document.getElementById('overlay');
  const header  = document.getElementById('drawer-header');
  const body    = document.getElementById('drawer-body');

  header.innerHTML = `
    <div style="display:flex;align-items:center;gap:.75rem;flex-wrap:wrap">
      <span style="font-family:var(--mono);font-size:.85rem;color:var(--gold);font-weight:700">${esc(code)}</span>
      <span style="font-weight:700;font-size:1rem">${esc(title)}</span>
      <span class="sugg-badge ${isCore ? 'core' : 'elective'}">${catLabel}</span>
    </div>
    <div style="font-size:.78rem;color:var(--muted);margin-top:.35rem">${esc(meta.program_section || '')}</div>`;

  // Sort roles by delta descending
  const roles = state.sRole === 'all' ? SROLELABELS : [state.sRole];
  const sorted = roles
    .filter(r => cdata[r])
    .sort((a, b) => (cdata[b].d || 0) - (cdata[a].d || 0));

  body.innerHTML = sorted.map(role => {
    const rd     = cdata[role];
    const delta  = rd.d;
    const dclass = delta > 0 ? 'pos' : 'zero';
    const dsign  = delta > 0 ? '+' : '';
    const kws    = (rd.k || []).map(w =>
      `<span class="sugg-kw-chip">${esc(w)}</span>`).join('');

    return `<div class="sugg-drawer-role">
      <div class="sugg-drawer-head">
        <span class="sugg-drawer-rname">${esc(role)}</span>
      </div>
      <div class="sugg-drawer-scores">
        <div class="sugg-sco-block">
          <div class="sugg-sco-val before">${rd.b.toFixed(1)}</div>
          <div class="sugg-sco-label">Before</div>
        </div>
        <span class="sugg-arrow-big">→</span>
        <div class="sugg-sco-block">
          <div class="sugg-sco-val after">${rd.a.toFixed(1)}</div>
          <div class="sugg-sco-label">After</div>
        </div>
        <div class="sugg-delta-big ${dclass}" style="margin-left:.5rem">${dsign}${delta.toFixed(1)}</div>
      </div>
      <div class="sugg-kw-area">
        <div class="sugg-kw-label">Suggested keywords to add to description</div>
        <div class="sugg-kw-chips">${kws}</div>
        <div class="sugg-note">Adding these terms — which appear in similar courses and are
          in-demand for <em>${esc(role)}</em> roles — would improve alignment from
          ${rd.b.toFixed(1)} → ${rd.a.toFixed(1)}.</div>
      </div>
    </div>`;
  }).join('');

  if (!body.innerHTML) {
    body.innerHTML = '<p style="color:var(--muted)">No suggestion data for this course.</p>';
  }

  drawer.classList.add('open');
  overlay.classList.add('visible');
  state.selected = code;
}

// ── Student Planner ───────────────────────────────────────────────────────────
function setPlanRole(role) {
  state.pRole = (state.pRole === role) ? null : role;
  document.querySelectorAll('.plan-role-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.role === state.pRole));
  renderGrid();
}

function setPlanFilter(key, val, el) {
  if (key === 'format') state.pFormat = val;
  if (key === 'cat')    state.pCat    = val;
  el.closest('.filter-chips').querySelectorAll('.chip')
    .forEach(b => b.classList.toggle('active', b === el));
  renderGrid();
}

function toggleDone(code) {
  if (state.pCompleted.has(code)) state.pCompleted.delete(code);
  else state.pCompleted.add(code);
  const summary = document.getElementById('plan-done-summary');
  if (summary) summary.textContent = state.pCompleted.size
    ? `${state.pCompleted.size} course${state.pCompleted.size > 1 ? 's' : ''} marked done`
    : '';
  renderGrid();
}

function scoreColor(s) {
  return s >= 70 ? '#16A34A' : s >= 40 ? '#D97706' : '#DC2626';
}

function renderCompletedList() {
  const q = (document.getElementById('plan-done-search')?.value || '').toLowerCase().trim();
  const container = document.getElementById('plan-done-list');
  if (!container) return;
  const items = q
    ? allCourses.filter(c => (c.course_code + ' ' + c.course_title).toLowerCase().includes(q))
    : allCourses;
  container.innerHTML = items.map(c => {
    const done = state.pCompleted.has(c.course_code);
    const sc = c.course_code.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    return `<label class="plan-done-item">
      <input type="checkbox" ${done ? 'checked' : ''}
             onchange="toggleDone('${sc}')">
      <span class="plan-done-code">${c.course_code}</span>
      <span class="plan-done-name">${c.course_title.slice(0, 42)}</span>
    </label>`;
  }).join('');
  const summary = document.getElementById('plan-done-summary');
  if (summary) summary.textContent = state.pCompleted.size
    ? `${state.pCompleted.size} course${state.pCompleted.size > 1 ? 's' : ''} marked done`
    : '';
}

function renderPlannerSidebar() {
  const roleList = document.getElementById('plan-role-list');
  if (!roleList) return;
  roleList.innerHTML = SROLELABELS.map(r => {
    const safe = r.replace(/&/g, '&amp;').replace(/"/g, '&quot;');
    return `<button class="plan-role-btn${state.pRole === r ? ' active' : ''}"
       data-role="${safe}" onclick="setPlanRole(this.dataset.role)">${safe}</button>`;
  }).join('');
  renderCompletedList();
}

function filteredPlanner() {
  if (!state.pRole) return [];
  return allCourses.filter(c => {
    if (state.pCompleted.has(c.course_code)) return false;
    if (state.pFormat === 'online' && c.format !== 'online') return false;
    if (state.pFormat === 'campus' && c.format !== 'campus') return false;
    if (state.pCat !== 'all') {
      const secRaw = (c.program_section || '').toLowerCase();
      const isCore = !secRaw.includes('section 4') && !secRaw.includes('elective');
      if (state.pCat === 'core'     && !isCore) return false;
      if (state.pCat === 'elective' && isCore)  return false;
    }
    return SDATA[c.course_code] && SDATA[c.course_code][state.pRole] != null;
  }).sort((a, b) => {
    const sa = SDATA[a.course_code]?.[state.pRole]?.b ?? 0;
    const sb = SDATA[b.course_code]?.[state.pRole]?.b ?? 0;
    return sb - sa;
  });
}

function renderPlanCard(course, rank) {
  const code = course.course_code;
  const rd = SDATA[code]?.[state.pRole];
  if (!rd) return '';
  const score = rd.b;
  const color = scoreColor(score);
  const secRaw = (course.program_section || '').toLowerCase();
  const isCore = !secRaw.includes('section 4') && !secRaw.includes('elective');
  const desc = (course.description || '').slice(0, 130).trim();
  const sc = code.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  return `<div class="plan-card" onclick="openDrawer('course','${sc}')">
    <div>
      <div class="plan-card__score" style="color:${color}">${score.toFixed(0)}</div>
      <div class="plan-score-sub">fit</div>
    </div>
    <div class="plan-card__body">
      <div class="plan-card__head">
        <span class="plan-rank">#${rank}</span>
        <span class="plan-card__code">${code}</span>
        <span class="sugg-badge ${isCore ? 'core' : 'elective'}">${isCore ? 'Core' : 'Elective'}</span>
        <span class="sugg-badge online">${code.startsWith('DTSA') ? 'Online' : 'On-Campus'}</span>
      </div>
      <div class="plan-card__title">${course.course_title}</div>
      ${desc ? `<div class="plan-card__desc">${desc}&hellip;</div>` : ''}
      <button class="plan-done-btn" onclick="event.stopPropagation();toggleDone('${sc}');renderCompletedList()">&#10003; Mark as done</button>
    </div>
  </div>`;
}

// Init
initFilters();
renderStats();
renderFilters();
renderGrid();

</script>
